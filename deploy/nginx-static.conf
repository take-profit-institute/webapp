# Next 정적 export 서빙용 nginx 설정 (webapp/admin 공용).
# 두 앱 모두 trailingSlash=true라 라우트가 `route/index.html`로 생성되므로
# 디렉터리 인덱스 폴백이 필요하다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 컨테이너 헬스체크용 — 정적 파일과 무관하게 항상 200
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 파일명에 해시가 붙는 빌드 산출물은 불변이므로 길게 캐시
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML은 캐시하지 않는다 — 새 이미지 배포가 즉시 반영되도록
    location / {
        try_files $uri $uri/ $uri/index.html /404.html;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
