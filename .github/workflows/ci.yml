name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      bff: ${{ steps.filter.outputs.bff }}
      webapp: ${{ steps.filter.outputs.webapp }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bff:    ['bff/**', 'shared/**']
            webapp: ['webapp/**', 'shared/**']
            admin:  ['admin/**', 'shared/**']

  # dev 태그는 로컬/CI/배포 환경에서 함께 쓰므로 amd64 + arm64 manifest를 같이 푸시한다.
  # bff: ECR push + candle-k8s services-<env>.yaml 태그 bump (백엔드 aws-ci.yml과 동일 패턴).
  # k8s가 기대하는 <account>.dkr.ecr.../candle/bff:<SHA> 로 올린다. (Docker Hub 아님)
  # EKS 노드는 amd64라 amd64만 빌드. 자격증명은 OIDC(ci_deploy_role).
  push-bff:
    needs: changes
    if: needs.changes.outputs.bff == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bff/Dockerfile
          push: true
          platforms: linux/amd64
          # ECR IMMUTABLE: SHA 태그만(고유). :dev 같은 이동 태그는 덮어쓰기 불가라 넣지 않는다.
          tags: ${{ steps.ecr.outputs.registry }}/candle/bff:${{ github.sha }}
          cache-from: type=gha,scope=bff
          cache-to: type=gha,mode=max,scope=bff
      - uses: ./.github/actions/bump-tag
        if: github.event_name != 'pull_request'
        with:
          service: bff
          tag: ${{ github.sha }}
          env: dev
          appset: services
          token: ${{ secrets.GITOPS_TOKEN }}

      # lite(k3s) 배포는 push-bff-lite 잡이 소유한다(Docker Hub + 자체 bump).
      # 여기서 lite를 같이 bump하면 두 잡이 같은 필드를 서로 다른 태그로 덮어써 경쟁한다.

  # bff → Docker Hub (yyubin/candle-bff:dev). ECR(push-bff)와 별개로, 로컬/수동 배포에서
  # 끌어다 쓰는 이동 태그(:dev)를 Docker Hub에 올린다. Docker Hub는 ECR과 달리 태그 덮어쓰기 허용.
  # :dev 는 로컬(arm64)·클러스터(amd64) 양쪽에서 쓰이므로 멀티아치 매니페스트로 푸시한다.
  # 자격증명: repo secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (Docker Hub access token).
  push-bff-dockerhub:
    needs: changes
    if: needs.changes.outputs.bff == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # arm64 크로스빌드용 에뮬레이터
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # 컨텍스트는 모노레포 루트(shared + bff 함께 빌드), Dockerfile 은 bff/Dockerfile
          context: .
          file: bff/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: yyubin/candle-bff:dev
          cache-from: type=gha,scope=bff-hub
          cache-to: type=gha,mode=max,scope=bff-hub

  # bff → Docker Hub (yyubin/candle-bff:lite, :<SHA>) + candle-k8s-lite 태그 bump.
  #
  # lite를 push-bff(ECR)에서 떼어낸 이유:
  #   - lite 클러스터는 gateway/webapp/admin이 이미 전부 Docker Hub를 쓴다. bff만 ECR을 타면
  #     lite 배포가 AWS OIDC(ci_deploy_role) 성공 여부에 묶인다 — 프론트는 안 묶여 있는데.
  #   - prod(ECR)와 lite의 롤아웃을 독립적으로 굴릴 수 있다.
  # webapp/admin과 달리 빌드 인자는 없다. bff는 Node 서버라 설정이 전부 런타임 env
  # (services-dev.yaml)에서 오고, 이미지 내용물은 ECR 것과 동일하다. 나뉘는 건 레지스트리와
  # 롤아웃 시점뿐이다.
  #
  # 태그를 :lite 같은 이동 태그가 아니라 커밋 SHA로 고정하는 이유는 bump-lite-image 액션
  # 주석과 같다 — 이동 태그는 노드 캐시가 그대로 쓰이고 ArgoCD도 롤아웃을 트리거하지 않는다.
  # lite 노드(t3.xlarge)는 amd64라 amd64만 빌드한다(:dev 멀티아치는 push-bff-dockerhub 담당).
  push-bff-lite:
    needs: changes
    if: needs.changes.outputs.bff == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # 컨텍스트는 모노레포 루트(shared + bff 함께 빌드), Dockerfile 은 bff/Dockerfile
          context: .
          file: bff/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            yyubin/candle-bff:lite
            yyubin/candle-bff:${{ github.sha }}
          cache-from: type=gha,scope=bff-lite
          cache-to: type=gha,mode=max,scope=bff-lite
      # bff는 lite에서도 ApplicationSet element라 frontend.yaml을 고치는 bump-lite-image가 아니라
      # elements[].tag를 고치는 bump-tag를 쓴다. 이미지 레지스트리는 services-dev.yaml의
      # bff element에 image: "yyubin/candle-bff" 로 고정돼 있다(gateway와 같은 방식).
      - uses: ./.github/actions/bump-tag
        if: github.event_name != 'pull_request'
        with:
          service: bff
          tag: ${{ github.sha }}
          env: dev
          appset: services
          repo: candle-k8s-lite
          token: ${{ secrets.GITOPS_TOKEN }}

  # ── lite(k3s) 배포용 정적 이미지 ─────────────────────────────────────────────
  # lite는 S3+CloudFront 대신 클러스터 안 nginx로 서빙한다(추가 AWS 리소스 0).
  # NEXT_PUBLIC_*는 정적 export 시점에 번들로 박히므로 lite 도메인으로 별도 빌드한다.
  # candle-k8s-lite 의 frontend.yaml 이 :<SHA> 태그를 참조한다.
  push-webapp-lite:
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: webapp/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.lite.candle.io.kr
            NEXT_PUBLIC_AUTH_BASE_URL=https://api.lite.candle.io.kr
            NEXT_PUBLIC_WS_BASE_URL=wss://api.lite.candle.io.kr
            NEXT_PUBLIC_CHAT_API_BASE_URL=https://api.lite.candle.io.kr
            NEXT_PUBLIC_CHAT_WS_BASE_URL=wss://api.lite.candle.io.kr
            NEXT_PUBLIC_OAUTH_REDIRECT_BRIDGE_URL=https://app.lite.candle.io.kr/auth/callback
            NEXT_PUBLIC_OAUTH_NATIVE_REDIRECT_URI=com.candle.app://auth/callback
            NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyAf6a4Z6eyjt4svQDgCglP_xdCtUsozV2w
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=candle-bfce9.firebaseapp.com
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=candle-bfce9
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=candle-bfce9.firebasestorage.app
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=712132485233
            NEXT_PUBLIC_FIREBASE_APP_ID=1:712132485233:web:1d160ba1748475bd103bd0
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-Z9E5649TY7
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=BDviTHHrHk_L_UaMyfCrlvBr1aUG18XWx98IDociuUDaNmAxNqNrVgDqaNQ67SqVBMuZOjukMwcuwf6SVn4sQhA
          tags: |
            yyubin/candle-webapp:lite
            yyubin/candle-webapp:${{ github.sha }}
          cache-from: type=gha,scope=webapp-lite
          cache-to: type=gha,mode=max,scope=webapp-lite
      # candle-k8s-lite 의 frontend.yaml image 태그를 방금 푸시한 SHA로 갱신 → ArgoCD가 배포
      - uses: ./.github/actions/bump-lite-image
        with:
          name: webapp
          image: yyubin/candle-webapp:${{ github.sha }}
          token: ${{ secrets.GITOPS_TOKEN }}

  push-admin-lite:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: admin/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.lite.candle.io.kr
            NEXT_PUBLIC_AUTH_BASE_URL=https://api.lite.candle.io.kr
          tags: |
            yyubin/candle-admin:lite
            yyubin/candle-admin:${{ github.sha }}
          cache-from: type=gha,scope=admin-lite
          cache-to: type=gha,mode=max,scope=admin-lite
      # candle-k8s-lite 의 frontend.yaml image 태그를 방금 푸시한 SHA로 갱신 → ArgoCD가 배포
      - uses: ./.github/actions/bump-lite-image
        with:
          name: admin
          image: yyubin/candle-admin:${{ github.sha }}
          token: ${{ secrets.GITOPS_TOKEN }}

  # webapp: 정적 export(next output=export) → S3 sync → CloudFront invalidation.
  # 컨테이너 대신 CloudFront+S3(static-site 모듈)로 서빙한다. 자격증명은 GitHub OIDC로
  # ci_deploy_role 을 assume (정적 키 없음). role/bucket/dist 는 Terraform output 값을
  # 레포 Secrets/Variables 에 등록한다.
  deploy-webapp:
    needs: changes
    # S3+CloudFront 배포는 현재 비활성. 버킷/배포가 이 계정에 존재하지 않는다
    # (원래 인프라는 다른 계정에 있었고, NoSuchBucket으로 실패한다).
    # lite는 클러스터 내 nginx(push-webapp-lite)로 서빙한다.
    # 인프라를 복구해 다시 쓰려면 레포 변수 DEPLOY_STATIC_S3=true 를 설정한다.
    if: needs.changes.outputs.webapp == 'true' && vars.DEPLOY_STATIC_S3 == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # 빌드 타임에 정적 번들로 박히는 dev 공개 URL (dev.candle.io.kr).
      # 정적 export는 NEXT_PUBLIC_*가 빌드 시점에 박히므로 여기서 dev 엔드포인트를 준다.
      NEXT_PUBLIC_API_BASE_URL: https://api.dev.candle.io.kr
      NEXT_PUBLIC_AUTH_BASE_URL: https://api.dev.candle.io.kr
      NEXT_PUBLIC_WS_BASE_URL: wss://ws.dev.candle.io.kr
      NEXT_PUBLIC_CHAT_API_BASE_URL: https://ws.dev.candle.io.kr
      NEXT_PUBLIC_CHAT_WS_BASE_URL: wss://ws.dev.candle.io.kr
      NEXT_PUBLIC_OAUTH_REDIRECT_BRIDGE_URL: https://app.dev.candle.io.kr/auth/callback
      NEXT_PUBLIC_OAUTH_NATIVE_REDIRECT_URI: com.candle.app://auth/callback
      # Firebase 웹 클라이언트 config (공개 값 — env 무관 동일). 미설정 시 FCM 초기화 실패.
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyAf6a4Z6eyjt4svQDgCglP_xdCtUsozV2w
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: candle-bfce9.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: candle-bfce9
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: candle-bfce9.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "712132485233"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:712132485233:web:1d160ba1748475bd103bd0"
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-Z9E5649TY7
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: BDviTHHrHk_L_UaMyfCrlvBr1aUG18XWx98IDociuUDaNmAxNqNrVgDqaNQ67SqVBMuZOjukMwcuwf6SVn4sQhA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @candle/shared
      # NEXT_OUTPUT=export → webapp/out 정적 번들 생성
      - run: npm run build:app -w @candle/webapp
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync to S3
        run: aws s3 sync webapp/out "s3://${{ vars.WEBAPP_S3_BUCKET }}" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.WEBAPP_CLOUDFRONT_ID }}" --paths "/*"

  # admin: 정적 export(next output=export) → S3 sync → CloudFront invalidation.
  # webapp 과 동일 패턴 (OIDC 로 ci_deploy_role assume, 정적 키 없음).
  deploy-admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true' && vars.DEPLOY_STATIC_S3 == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # dev 공개 URL (빌드 타임 정적 번들에 박힘)
      NEXT_PUBLIC_API_BASE_URL: https://api.dev.candle.io.kr
      NEXT_PUBLIC_AUTH_BASE_URL: https://api.dev.candle.io.kr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w @candle/shared
      # next.config output=export → admin/out 정적 번들 생성
      - run: npm run build -w @candle/admin
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync to S3
        run: aws s3 sync admin/out "s3://${{ vars.ADMIN_S3_BUCKET }}" --delete
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.ADMIN_CLOUDFRONT_ID }}" --paths "/*"
